name: astrobite
description: "AstroBite - AI Food Scanner & Calorie Tracker"
publish_to: 'none'
version: 3.2.0+20


environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter_skill: ^0.2.6
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_app_check: ^0.3.1
  firebase_ai: ^2.3.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  auto_route: ^9.2.2

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2

  # Camera & Image
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  google_sign_in: ^6.2.2
  google_generative_ai: ^0.4.7
  shared_preferences: ^2.5.3
  home_widget: ^0.9.2+1
  flutter_markdown_plus: ^1.0.7
  camera: ^0.11.2+1
  solar_icons: ^0.0.5
  camera_android: ^0.10.10+6
  camera_platform_interface: ^2.12.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  auto_route_generator: ^9.0.0
  riverpod_generator: ^2.6.3
  freezed: ^3.0.2
  json_serializable: ^6.9.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A192F"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
