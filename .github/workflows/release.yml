name: AstroBite Release CI/CD

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag or version name to release'
        required: false
        default: 'manual-build'

permissions:
  contents: write

jobs:
  # =========================================================================
  # 🛡️ JOB 0: QUALITY GATE (STATIC ANALYSIS & AUTOMATED TESTS) — ASTRO-025
  # =========================================================================
  quality-gate:
    name: Quality Gate (Analyze & Test)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.2'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔍 Static Code Analysis (0 Errors, 0 Warnings Policy)
        run: flutter analyze --fatal-infos

      - name: 🧪 Run Automated Test Suite
        run: flutter test --coverage

      - name: 📊 Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage-report
          path: coverage/lcov.info
          retention-days: 7

  # =========================================================================
  # 🤖 JOB 1: ANDROID RELEASE BUILD (APK & AAB)
  # =========================================================================
  build-android:
    name: Build Android (Fastlane)
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.2'
          cache: true

      - name: 💎 Set up Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: 🔐 Configure Environment & Android Secrets
        run: |
          # 1. Environment file & Key Validation (ASTRO-027)
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          elif [ -f ".env.example" ]; then
            if [ -n "${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' }}" ]; then
              echo "::error ::Release build blocked: No valid GEMINI_API_KEY configured (ASTRO-027)."
              exit 1
            fi
            cp .env.example .env
            echo "::warning ::No ENV_FILE or GEMINI_API_KEY secret configured. App will build with default .env.example"
          fi

          # 2. Firebase Google Services JSON
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
          fi

          # 3. Android Signing Keystore & key.properties
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          fi
          # 4. Distribution Credentials Flag (ASTRO-026)
          if [ -n "${{ secrets.FIREBASE_APP_DISTRIBUTION_CREDENTIALS }}" ]; then
            echo "HAS_FIREBASE_CREDENTIALS=true" >> $GITHUB_ENV
          else
            echo "HAS_FIREBASE_CREDENTIALS=false" >> $GITHUB_ENV
          fi

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🚀 Build Android Release via Fastlane
        run: cd android && bundle exec fastlane android build_release

      - name: 📤 Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: 🏷️ Attach Android Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📱 Distribute Android APK to Firebase Testers (ASTRO-026)
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release') && env.HAS_FIREBASE_CREDENTIALS == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID || '1:925552313324:android:31ea07eec9ad23375d36c9' }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_APP_DISTRIBUTION_CREDENTIALS }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS || 'internal-testers' }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "AstroBite Release ${{ github.ref_name || 'Automated Release' }} — APK for Testers"

      - name: 📋 Android Delivery Summary (ASTRO-026)
        if: always()
        run: |
          echo "## 🤖 Android Release & Delivery Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "- ✅ **APK Build**: Generated successfully (\`app-release.apk\`)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **APK Build**: Missing artifact" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ env.HAS_FIREBASE_CREDENTIALS }}" = "true" ]; then
            echo "- 🚀 **Firebase Distribution**: Dispatched to internal testers" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️ **Firebase Distribution**: Skipped (no credentials configured)" >> $GITHUB_STEP_SUMMARY
          fi

  # =========================================================================
  # 🍎 JOB 2: IOS RELEASE BUILD (IPA)
  # =========================================================================
  build-ios:
    name: Build iOS (Fastlane)
    runs-on: macos-latest
    needs: [quality-gate]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.2'
          cache: true

      - name: 💎 Set up Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: 🍎 Set up CocoaPods for Ruby 3.3
        run: gem install cocoapods --no-document

      - name: 🔐 Configure Environment & iOS Secrets
        run: |
          # 1. Environment file & Key Validation (ASTRO-027)
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          elif [ -f ".env.example" ]; then
            if [ -n "${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' }}" ]; then
              echo "::error ::Release build blocked: No valid GEMINI_API_KEY configured (ASTRO-027)."
              exit 1
            fi
            cp .env.example .env
            echo "::warning ::No ENV_FILE or GEMINI_API_KEY secret configured. App will build with default .env.example"
          fi

          # 2. Firebase GoogleService-Info.plist
          if [ -n "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 -d > ios/Runner/GoogleService-Info.plist
          fi

          # 3. Distribution Credentials Flag (ASTRO-026)
          if [ -n "${{ secrets.FIREBASE_APP_DISTRIBUTION_CREDENTIALS }}" ]; then
            echo "HAS_FIREBASE_CREDENTIALS=true" >> $GITHUB_ENV
          else
            echo "HAS_FIREBASE_CREDENTIALS=false" >> $GITHUB_ENV
          fi

      - name: 📦 Install Flutter Dependencies & CocoaPods
        run: |
          flutter pub get
          cd ios && pod install

      - name: 🚀 Build iOS Release via Fastlane
        run: cd ios && bundle exec fastlane ios build_release
        env:
          APPLE_CERTIFICATE_KEY_P12: ${{ secrets.APPLE_CERTIFICATE_KEY_P12 }}

      - name: 📦 Archive iOS build folder if IPA not generated
        run: |
          if [ ! -d "build/ios/ipa" ]; then
            mkdir -p build/ios/ipa
            tar -czf build/ios/ipa/Runner-app.tar.gz -C build/ios/archive/Runner.xcarchive . 2>/dev/null || true
          fi

      - name: 📤 Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-artifacts
          path: |
            build/ios/ipa/*.ipa
            build/ios/ipa/*.tar.gz
          retention-days: 14

      - name: 🏷️ Attach iOS Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ios/ipa/*.ipa
            build/ios/ipa/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📱 Distribute iOS IPA to Firebase Testers (ASTRO-026)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        run: |
          IPA_FILE=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -n 1 || true)
          if [ -z "$IPA_FILE" ]; then
            if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
              echo "::error ::Release delivery failed: No .ipa artifact found in build/ios/ipa/ for distribution (ASTRO-026)."
              exit 1
            else
              echo "::notice ::No .ipa artifact generated (archive generated instead). Skipping Firebase App Distribution for iOS."
              exit 0
            fi
          fi

          if [ "${{ env.HAS_FIREBASE_CREDENTIALS }}" != "true" ]; then
            echo "::notice ::No FIREBASE_APP_DISTRIBUTION_CREDENTIALS secret configured. Skipping upload."
            exit 0
          fi

          export GOOGLE_APPLICATION_CREDENTIALS="/tmp/firebase_sa.json"
          echo "${{ secrets.FIREBASE_APP_DISTRIBUTION_CREDENTIALS }}" > "$GOOGLE_APPLICATION_CREDENTIALS"

          npx --yes firebase-tools appdistribution:distribute "$IPA_FILE" \
            --app "${{ secrets.FIREBASE_APP_ID_IOS || '1:925552313324:ios:d8bb8269224dff455d36c9' }}" \
            --groups "${{ secrets.FIREBASE_TESTER_GROUPS || 'internal-testers' }}" \
            --release-notes "AstroBite iOS Release ${{ github.ref_name || 'Automated Release' }} — IPA for Testers"

      - name: 📋 iOS Delivery Summary (ASTRO-026)
        if: always()
        run: |
          echo "## 🍎 iOS Release & Delivery Summary" >> $GITHUB_STEP_SUMMARY
          IPA_FILE=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -n 1 || true)
          if [ -n "$IPA_FILE" ]; then
            echo "- ✅ **IPA Build**: Generated successfully (\`$IPA_FILE\`)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️ **IPA Build**: No IPA artifact (Archive generated)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ env.HAS_FIREBASE_CREDENTIALS }}" = "true" ] && [ -n "$IPA_FILE" ]; then
            echo "- 🚀 **Firebase Distribution**: Dispatched to internal testers" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️ **Firebase Distribution**: Skipped" >> $GITHUB_STEP_SUMMARY
          fi
